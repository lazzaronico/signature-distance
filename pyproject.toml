[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sigdist"
version = "0.2.1"
description = "Radial signature comparisons for empirical distributions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
examples = ["scipy", "pandas", "matplotlib", "seaborn", "scikit-learn", "igraph", "leidenalg"]
test = ["pytest", "scipy", "pandas", "matplotlib", "seaborn", "scikit-learn"]

[tool.setuptools.packages.find]
include = ["sigdist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
